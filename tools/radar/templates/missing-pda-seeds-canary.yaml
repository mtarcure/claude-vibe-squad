version: 0.1.0
author: Vibe Squad
accent: anchor
name: Missing PDA Seeds Constraint Canary
description: Detects an Anchor token transfer that accepts an AccountInfo authority while declaring no seeds or bump account constraint in the source file.
severity: Medium
certainty: Medium
vulnerable_example: fixtures/vulnerable/programs/pda-canary/src/lib.rs
rule: |
  for source, nodes in ast:
      try:
          transfer_nodes = nodes.find_chained_calls("transfer").exit_on_none()
          nodes.find_by_names("AccountInfo").exit_on_none()
          nodes.find_macro_attribute_by_names("seeds", "bump").exit_on_value()
          for transfer_node in transfer_nodes:
              print(transfer_node.first().to_result())
      except:
          continue

