rules:
  - id: proof-verifier-i1-strict-index-bounds-signal
    languages: [solidity]
    severity: INFO
    message: A per-leaf strict index-bound rejection signal is present; verify full-array coverage and dominance manually.
    patterns:
      - metavariable-regex:
          metavariable: $COUNT
          regex: (?i).*(count|total|size|len).*
      - pattern-either:
          - pattern: |
              if ($LEAVES[$I].index >= $COUNT) {
                revert $ERR(...);
              }
          - pattern: |
              if ($COUNT <= $LEAVES[$I].index) {
                revert $ERR(...);
              }
          - pattern: require($LEAVES[$I].index < $COUNT, ...)

  - id: proof-verifier-i2-leaf-consumption-signal
    languages: [solidity]
    severity: INFO
    message: A leaf-cursor exhaustion rejection signal is present; verify it uses the reconstruction cursor and dominates acceptance.
    patterns:
      - metavariable-regex:
          metavariable: $POS
          regex: (?i).*leaf.*
      - pattern-either:
          - pattern: |
              if ($POS != $LEAVES.length) {
                revert $ERR(...);
              }
          - pattern: require($POS == $LEAVES.length, ...)

  - id: proof-verifier-i3-strict-order-signal
    languages: [solidity]
    severity: INFO
    message: A strict adjacent-index order rejection signal is present; verify the loop covers the original input.
    patterns:
      - pattern-either:
          - pattern: |
              if ($LEAVES[$I].index <= $LEAVES[$I - 1].index) {
                revert $ERR(...);
              }
          - pattern: require($LEAVES[$I].index > $LEAVES[$I - 1].index, ...)

  - id: proof-verifier-i4-proof-consumption-signal
    languages: [solidity]
    severity: INFO
    message: A proof-cursor exhaustion rejection signal is present; verify it uses the reconstruction cursor and dominates acceptance.
    patterns:
      - metavariable-regex:
          metavariable: $POS
          regex: (?i).*proof.*
      - pattern-either:
          - pattern: |
              if ($POS != $PROOF.length) {
                revert $ERR(...);
              }
          - pattern: require($POS == $PROOF.length, ...)

  - id: proof-verifier-i5-indexed-leaf-commitment-signal
    languages: [solidity]
    severity: INFO
    message: An index and leaf value appear in one commitment; verify canonical encoding and that the result reaches the accepted root.
    pattern-either:
      - pattern: keccak256(abi.encode(..., $LEAF.index, ..., $LEAF.data, ...))
      - pattern: keccak256(abi.encodePacked(..., $LEAF.index, ..., $LEAF.data, ...))
