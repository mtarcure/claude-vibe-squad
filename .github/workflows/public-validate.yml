name: Public Validate

# The public repo ships the mechanism, not our measurements: the rigs and their
# controls, the technique vocabulary, the evidence signatures, the exporter, and
# the recommended-toolchain catalog. It deliberately does NOT ship our arsenal
# census or our capability cards.
#
# So it cannot run squad-validate.yml, and that is not a gap to paper over:
#   - validate-capabilities.sh runs registry-free but proves nothing here: with
#     shared/registries/skill-tool-registry.tsv absent and untracked it emits a
#     typed `registry-not-published` / `not-applicable` result and exits 0
#     (registry_publication_state in scripts/python/validate_capabilities.py),
#     so a green run would be vacuous. In the private tree the registry is
#     tracked, and tracked-but-missing still fails closed — a real deletion
#     cannot pass silently there.
#   - validate-specialists.sh DOES pass here, on a reduced check set. The
#     private registry is not published, so it selects index,source,required,
#     existence and excludes boundary,parity -- and the pinned baseline is
#     loaded only for those two, so its absence never arises. Measured on a
#     registry-free fresh-history archive: exit 0, 68 passed, announcing the
#     public subset rather than skipping quietly. The subset still has subjects
#     and can still fail: an injected generated-index defect exits 1.
#     It refuses only when the registry IS present and the baseline is absent
#     (exit 2, naming the missing commit) -- the maintainer-shaped case.
#
# How each validator degrades outside the maintainer checkout is documented
# once, in docs/production-readiness.md (Release Checklist). Instead of running
# them vacuously or red, validate what is actually here.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "33 11 * * *"
  workflow_dispatch:

# Match the private workflow's event-preserving de-duplication. The run id
# keeps scheduled/manual validation independent from commit-triggered runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    # This file is authored in the private repo and travels to public with the
    # export, so it exists in BOTH. It must only run in public: the private tree
    # legitimately contains absolute /Users/ paths in rig run logs, which the
    # last step here treats as a failure. `github.repository` is set by the
    # runner and is not attacker-controllable, unlike event payload fields.
    if: github.repository == 'mtarcure/claude-vibe-squad'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: bash -n $(git ls-files '*.sh')

      - name: Python compile
        run: |
          files=$(git ls-files '*.py')
          [ -n "$files" ] && python3 -m py_compile $files
          echo "compiled $(echo "$files" | wc -w) file(s)"

      - name: Coverage-ledger control suite
        # The controls are the point: mentions-only fixtures must classify as
        # MISSED, so that naming a tool in an artifact is never mistaken for
        # evidence that it ran. A rig whose controls pass is a rig you can trust.
        run: python3 tools/coverage-ledger/coverage_ledger.py controls

      - name: Recommended-toolchain catalog is well-formed
        run: |
          python3 - <<'PY'
          import csv, pathlib, sys
          p = pathlib.Path("shared/registries/recommended-toolchain.tsv")
          rows = [r for r in p.read_text(encoding="utf-8").splitlines()
                  if r and not r.startswith("#")]
          header = rows[0].split("\t")
          expected = ["name", "kind", "purpose", "hunting_type", "target_class"]
          if header != expected:
              sys.exit(f"header drift: {header!r} != {expected!r}")
          bad = [r for r in rows[1:] if len(r.split("\t")) != len(expected)]
          if bad:
              sys.exit(f"{len(bad)} row(s) have the wrong column count")
          print(f"catalog OK: {len(rows) - 1} recommended tools")
          PY

      - name: No engagement-target material
        # Standalone and intentionally pointed at the checked-out public tree.
        # This publishable scanner carries checks 2-4 only; the private
        # engagement-name blocklist never enters the projected repository.
        # The job-level repository guard keeps it off the private source tree,
        # where retained engagement work product is expected.
        run: python3 tools/export/target_scan_public.py .

      - name: No private paths or identifiers
        # A standing guard, not a one-off cleanup. The export gate enforces this
        # before publishing; this asserts it stayed true afterwards.
        #
        # The patterns are assembled at runtime rather than written literally.
        # Spelling them out would make this file match its own check -- which it
        # did on the first rehearsal, failing the gate on itself.
        run: |
          home_pattern="/Us""ers/chrono"
          ident_pattern="chrono""claw"

          # Exercise each split runtime pattern against an independently
          # assembled canary outside the checkout. A broken construction must
          # fail the guard before an empty production scan can look reassuring.
          control_dir="$(mktemp -d "${RUNNER_TEMP:?RUNNER_TEMP is not set}/public-ident-control.XXXXXX")"
          control_file="${control_dir}/private-identifiers.txt"
          printf '/%s/%s\n%s%s\n' 'Users' 'chrono' 'chrono' 'claw' > "$control_file"

          if git -C "$control_dir" grep --no-index -qI -e "$home_pattern" -- .; then
            :
          else
            control_status=$?
            echo "::error::private-path positive control failed (git grep exited ${control_status})"
            exit "$control_status"
          fi
          if git -C "$control_dir" grep --no-index -qI -e "$ident_pattern" -- .; then
            :
          else
            control_status=$?
            echo "::error::private-identifier positive control failed (git grep exited ${control_status})"
            exit "$control_status"
          fi

          if git grep -nI -e "$home_pattern" -e "$ident_pattern" -- . ; then
            echo "::error::private path or identifier present in the public tree"
            exit 1
          else
            grep_status=$?
            if [ "$grep_status" -ne 1 ]; then
              echo "::error::private path/identifier scan failed (git grep exited ${grep_status})"
              exit "$grep_status"
            fi
          fi
          echo "no private paths or identifiers"
